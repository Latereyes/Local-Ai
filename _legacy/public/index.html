<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="LocalAI Chat - Assistente AI locale con generazione immagini, ricerca web e gestione file">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LocalAI Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/styles/github-dark.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">⚡</div>
          <span class="logo-text">LocalAI</span>
        </div>
        <button id="sidebar-close-btn" class="icon-btn sidebar-close" aria-label="Chiudi sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <button id="new-chat-btn" class="new-chat-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <span>Nuova Chat</span>
      </button>

      <div class="sidebar-search">
        <input type="text" id="search-chat" class="glass-input" placeholder="Cerca conversazione..." style="width: 100%; margin-bottom: 10px; font-size: 0.9rem;">
      </div>

      <div id="conversations-list" class="conversations-list"></div>

      <div class="sidebar-footer">
        <button id="export-chat-btn" class="sidebar-footer-btn" title="Esporta Chat (Markdown)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span>Esporta</span>
        </button>
        <button id="gallery-btn" class="sidebar-footer-btn" title="Galleria immagini">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <span>Galleria</span>
        </button>
        <button id="files-btn" class="sidebar-footer-btn" title="Gestione file">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
          <span>File</span>
        </button>
      </div>
    </aside>

    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <!-- Header -->
      <header id="header" class="header">
        <button id="sidebar-toggle-btn" class="icon-btn" aria-label="Apri menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>

        <div class="header-center">
          <div style="font-weight: 500; color: var(--text-secondary); letter-spacing: 0.05em; text-transform: uppercase; font-size: 0.85rem;">Chat</div>
        </div>

        <div class="header-right">
          <button id="settings-btn" class="icon-btn" aria-label="Impostazioni" title="Impostazioni">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          </button>
          <div id="connection-status" class="connection-status" title="Stato connessione">
            <span class="status-dot"></span>
          </div>
        </div>
      </header>

      <!-- Chat Area -->
      <div id="chat-area" class="chat-area">
        <!-- Welcome Screen -->
        <div id="welcome-screen" class="welcome-screen">
          <div class="welcome-content">
            <div class="welcome-icon">⚡</div>
            <h1 class="welcome-title">LocalAI</h1>
            <p class="welcome-subtitle">Il tuo assistente AI locale, privato e potente</p>

            <div class="suggestions-grid">
              <button class="suggestion-card" data-prompt="Ciao! Raccontami qualcosa di interessante">
                <span class="suggestion-icon">💬</span>
                <span class="suggestion-text">Chatta con me su qualsiasi argomento</span>
              </button>
              <button class="suggestion-card" data-prompt="Genera un'immagine di un paesaggio fantasy con montagne e draghi">
                <span class="suggestion-icon">🎨</span>
                <span class="suggestion-text">Genera un'immagine creativa</span>
              </button>
              <button class="suggestion-card" data-prompt="Quali sono le ultime novità nel mondo della tecnologia?">
                <span class="suggestion-icon">🔍</span>
                <span class="suggestion-text">Cerca informazioni aggiornate</span>
              </button>
              <button class="suggestion-card" data-prompt="Mostrami i file nella cartella Documenti">
                <span class="suggestion-icon">📁</span>
                <span class="suggestion-text">Esplora i tuoi file</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Messages Container -->
        <div id="messages-container" class="messages-container"></div>
      </div>

      <!-- Input Area -->
      <div id="input-area" class="input-area">
        <div class="input-wrapper">
          <textarea
            id="message-input"
            class="message-input"
            placeholder="Scrivi un messaggio..."
            rows="1"
            aria-label="Scrivi un messaggio"
          ></textarea>
          <button id="send-btn" class="send-btn" aria-label="Invia messaggio" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" role="dialog" aria-label="Visualizzatore immagini">
    <button id="lightbox-close" class="lightbox-close" aria-label="Chiudi">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <img id="lightbox-img" class="lightbox-img" src="" alt="Immagine ingrandita">
    <p id="lightbox-caption" class="lightbox-caption"></p>
  </div>

  <!-- File Manager Modal -->
  <div id="file-manager-modal" class="modal" role="dialog" aria-label="Gestione file">
    <div class="modal-content file-manager-content">
      <div class="modal-header">
        <h2>📂 Gestione File</h2>
        <button id="file-manager-close" class="icon-btn" aria-label="Chiudi">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="file-breadcrumb" class="file-breadcrumb"></div>
      <div id="file-grid" class="file-grid"></div>
    </div>
  </div>

  <!-- Image Gallery Modal -->
  <div id="gallery-modal" class="modal" role="dialog" aria-label="Galleria immagini">
    <div class="modal-content gallery-content">
      <div class="modal-header">
        <h2>🖼️ Galleria Immagini</h2>
        <button id="gallery-close" class="icon-btn" aria-label="Chiudi">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="gallery-grid" class="gallery-grid"></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal" role="dialog" aria-label="Impostazioni">
    <div class="modal-content" style="max-width: 450px;">
      <div class="modal-header">
        <h2>⚙️ Impostazioni</h2>
        <button id="settings-close" class="icon-btn" aria-label="Chiudi">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div style="padding: 24px;">
        <div style="margin-bottom: 20px;">
          <label for="model-select" style="display:block; margin-bottom: 8px; color: var(--text-primary); font-weight: 500;">Modello Predefinito</label>
          <select id="model-select" class="glass-input" style="width: 100%;">
            <option value="">Caricamento modelli...</option>
          </select>
        </div>
        <div style="margin-bottom: 10px;">
          <label for="system-prompt-input" style="display:block; margin-bottom: 8px; color: var(--text-primary); font-weight: 500;">System Prompt Personale</label>
          <textarea id="system-prompt-input" class="glass-input" style="width: 100%; min-height: 80px; resize: vertical;" placeholder="Es: Rispondi sempre in italiano, sii conciso e professionale."></textarea>
        </div>
        <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;">
          Le impostazioni verranno salvate automaticamente.
        </p>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/highlight.min.js"></script>
  <script src="/js/app.js?v=4"></script>
  <script src="/js/imageGallery.js?v=4"></script>
  <script src="/js/fileManager.js?v=4"></script>
</body>
</html>
